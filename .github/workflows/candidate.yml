name: Release Candidate

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_NAME: Floatick

jobs:
  candidate:
    name: Build draft release
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release branch and version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ||
                ! "$GITHUB_REF_NAME" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Run this workflow from a release/x.y.z branch." >&2
            exit 1
          fi

          branch_version="${BASH_REMATCH[1]}"
          pkg_version=$(jq -r .version package.json)
          tauri_version=$(jq -r .version src-tauri/tauri.conf.json)

          if [[ "$pkg_version" != "$branch_version" && "$tauri_version" != "$branch_version" ]]; then
            echo "Branch release/$branch_version does not match version in package.json ($pkg_version) or tauri.conf.json ($tauri_version)." >&2
            exit 1
          fi

          app_version="$branch_version"

          if git ls-remote --exit-code --tags origin "refs/tags/v$app_version" >/dev/null 2>&1; then
            echo "Stable tag v$app_version already exists." >&2
            exit 1
          fi

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=candidate/v$app_version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend and backend tests
        run: |
          pnpm build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build macOS release bundles
        run: pnpm tauri build

      - name: Package candidate artifacts
        id: package
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        shell: bash
        run: |
          artifact_directory="$RUNNER_TEMP/artifacts"
          mkdir -p "$artifact_directory"

          dmg_source=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [[ -z "$dmg_source" || ! -f "$dmg_source" ]]; then
            echo "No DMG generated by Tauri build." >&2
            exit 1
          fi

          dmg_name="$PRODUCT_NAME-$APP_VERSION-macos.dmg"
          dmg_path="$artifact_directory/$dmg_name"
          cp "$dmg_source" "$dmg_path"

          (
            cd "$artifact_directory"
            shasum -a 256 "$dmg_name" > "$dmg_name.sha256"
          )
          dmg_sha256=$(awk '{print $1}' "$dmg_path.sha256")

          manifest_name="$PRODUCT_NAME-$APP_VERSION-release-manifest.json"
          manifest_path="$artifact_directory/$manifest_name"
          jq -n \
            --arg product "$PRODUCT_NAME" \
            --arg version "$APP_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg dmg "$dmg_name" \
            --arg sha256 "$dmg_sha256" \
            '{
              product: $product,
              version: $version,
              commit: $commit,
              dmg: $dmg,
              sha256: $sha256
            }' > "$manifest_path"

          echo "dmg_name=$dmg_name" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "manifest_name=$manifest_name" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          CANDIDATE_TAG: ${{ steps.version.outputs.candidate_tag }}
          DMG_NAME: ${{ steps.package.outputs.dmg_name }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
          MANIFEST_NAME: ${{ steps.package.outputs.manifest_name }}
          MANIFEST_PATH: ${{ steps.package.outputs.manifest_path }}
        shell: bash
        run: |
          release_exists=false
          if gh release view "$CANDIDATE_TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$CANDIDATE_TAG" \
              --json isDraft \
              --jq '.isDraft')
            if [[ "$is_draft" != "true" ]]; then
              echo "Candidate release $CANDIDATE_TAG is already public." >&2
              exit 1
            fi
            release_exists=true
          fi

          git tag --force "$CANDIDATE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$CANDIDATE_TAG"

          if [[ "$release_exists" == "true" ]]; then
            gh release edit "$CANDIDATE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$PRODUCT_NAME v$APP_VERSION — Candidate"
            gh release upload "$CANDIDATE_TAG" \
              "$DMG_PATH#$DMG_NAME" \
              "$DMG_PATH.sha256#$DMG_NAME.sha256" \
              "$MANIFEST_PATH#$MANIFEST_NAME" \
              --clobber
          else
            gh release create "$CANDIDATE_TAG" \
              "$DMG_PATH#$DMG_NAME" \
              "$DMG_PATH.sha256#$DMG_NAME.sha256" \
              "$MANIFEST_PATH#$MANIFEST_NAME" \
              --verify-tag \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$PRODUCT_NAME v$APP_VERSION — Candidate"
          fi

          echo "Draft release updated for commit $GITHUB_SHA."
